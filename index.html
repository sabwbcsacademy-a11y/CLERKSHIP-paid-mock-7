    const questions = [
      { id: 1, q: "শিশুর বিকাশের ক্ষেত্রে “বিকাশের পূর্বানুমেয় ধারা” বলতে কী বোঝায়?", options: ["A. সব শিশু একই সময়ে একই দক্ষতা অর্জন করে", "B. বিকাশের কিছু সাধারণ ক্রম ও ধারা লক্ষ্য করা যায়", "C. বিকাশ শুধুমাত্র বংশগতির দ্বারা নির্ধারিত হয়", "D. বিকাশ শুধুমাত্র বিদ্যালয়ে ঘটে"], ans: "B" },
      { id: 2, q: "একটি শিশুর ভাষাগত বিকাশ দ্রুত হলেও তার সামাজিক দক্ষতা তুলনামূলকভাবে ধীরে বিকশিত হচ্ছে। এটি কী নির্দেশ করে?", options: ["A. বিকাশের সব ক্ষেত্র একই গতিতে ঘটে", "B. বিকাশের বিভিন্ন ক্ষেত্রের গতি ভিন্ন হতে পারে", "C. শিশুটির কোনো বিকাশ ঘটছে না", "D. ভাষা বিকাশ সামাজিক বিকাশকে সম্পূর্ণভাবে নির্ধারণ করে"], ans: "B" },
      { id: 3, q: "একজন শিশু বাড়িতে বড়দের সঙ্গে কথা বলার সময় ভদ্রভাবে মত প্রকাশ করতে শেখে এবং পরে বিদ্যালয়ে একই আচরণ করে। এটি কোন ধারণার উদাহরণ?", options: ["A. সামাজিকীকরণের স্থানান্তর", "B. শারীরিক পরিপক্বতা", "C. Classical conditioning", "D. Cognitive conflict"], ans: "A" },
      { id: 4, q: "সহপাঠীদের সঙ্গে দলগত খেলায় অংশগ্রহণের মাধ্যমে শিশু প্রধানত কী শিখতে পারে?", options: ["A. শুধুমাত্র তথ্য মুখস্থ করা", "B. সহযোগিতা, নিয়ম মেনে চলা ও পারস্পরিক সম্পর্ক", "C. শুধুমাত্র শারীরিক বৃদ্ধি", "D. শুধুমাত্র লিখন দক্ষতা"], ans: "B" },
      { id: 5, q: "Behaviorism-এর দৃষ্টিভঙ্গিতে শিক্ষক কোনো কাঙ্ক্ষিত আচরণের পর সঙ্গে সঙ্গে প্রশংসা করলে তার উদ্দেশ্য কী?", options: ["A. আচরণকে দুর্বল করা", "B. কাঙ্ক্ষিত আচরণের পুনরাবৃত্তির সম্ভাবনা বৃদ্ধি করা", "C. শিক্ষার্থীর পূর্বজ্ঞান মুছে ফেলা", "D. শিক্ষার্থীর চিন্তন বন্ধ করা"], ans: "B" },
      { id: 6, q: "Cognitivism অনুযায়ী কোনো শিক্ষার্থী নতুন তথ্যকে পূর্বে শেখা তথ্যের সঙ্গে সম্পর্কিত করে মনে রাখছে। এখানে কোন প্রক্রিয়াটি গুরুত্বপূর্ণ?", options: ["A. তথ্যের মানসিক সংগঠন", "B. শুধুমাত্র শারীরিক অনুকরণ", "C. শুধুমাত্র পুরস্কার", "D. শুধুমাত্র শাস্তি"], ans: "A" },
      { id: 7, q: "একজন শিক্ষক একটি সমস্যার সরাসরি উত্তর না দিয়ে শিক্ষার্থীদের পূর্বজ্ঞান ব্যবহার করে বিভিন্ন সম্ভাব্য সমাধান খুঁজতে দেন। এটি কোন পদ্ধতির উদাহরণ?", options: ["A. Behaviorism", "B. Constructivism", "C. Classical conditioning", "D. Maturationism"], ans: "B" },
      { id: 8, q: "পিয়াজের মতে, একটি শিশু যদি বুঝতে পারে যে একটি কাঠির দৈর্ঘ্য তার অবস্থান পরিবর্তন করলেও একই থাকে, তবে এটি কোন ধারণার সঙ্গে সম্পর্কিত?", options: ["A. Conservation", "B. Egocentrism", "C. Animism", "D. Centration"], ans: "A" },
      { id: 9, q: "পিয়াজের মতে, formal operational stage-এ শিক্ষার্থীরা কোন ধরনের চিন্তনে সক্ষম হয়?", options: ["A. শুধুমাত্র ইন্দ্রিয়নির্ভর অনুসন্ধান", "B. শুধুমাত্র দৃশ্যমান বস্তুর ওপর নির্ভরশীল চিন্তা", "C. বিমূর্ত ধারণা ও সম্ভাব্য পরিস্থিতি নিয়ে চিন্তা", "D. শুধুমাত্র অনুকরণমূলক শেখা"], ans: "C" },
      { id: 10, q: "Vygotsky-এর মতে, একজন শিক্ষক যদি শিক্ষার্থীকে প্রথমে যথেষ্ট সহায়তা দেন এবং পরে ধীরে ধীরে সেই সহায়তা প্রত্যাহার করেন, তাহলে এটি কী নির্দেশ করে?", options: ["A. Scaffolding", "B. Punishment", "C. Rote learning", "D. Conditioning"], ans: "A" },
      { id: 11, q: "Vygotsky-এর মতে, শিশুর চিন্তন বিকাশে ভাষার ভূমিকা বোঝার জন্য কোন বিষয়টি বিশেষ গুরুত্বপূর্ণ?", options: ["A. ভাষা সামাজিক মিথস্ক্রিয়ার মাধ্যমে বিকশিত হয়", "B. ভাষা শুধুমাত্র জৈবিক পরিপক্বতার ফল", "C. ভাষা শেখার জন্য সামাজিক যোগাযোগের প্রয়োজন নেই", "D. ভাষা শুধুমাত্র মুখস্থ করার মাধ্যমে শেখা যায়"], ans: "A" },
      { id: 12, q: "Kohlberg-এর মতে, কোনো শিশু যদি অন্যদের অনুমোদন পাওয়ার জন্য ভালো আচরণ করে, তবে এটি কোন orientation-এর সঙ্গে সম্পর্কিত?", options: ["A. Punishment and obedience", "B. Instrumental purpose", "C. Good boy–good girl", "D. Universal ethical principle"], ans: "C" },
      { id: 13, q: "Bandura-এর সামাজিক শিক্ষণ তত্ত্বে “model” বলতে কী বোঝায়?", options: ["A. যে ব্যক্তির আচরণ পর্যবেক্ষণ করে অন্যরা শিখতে পারে", "B. একটি লিখিত পরীক্ষার কাঠামো", "C. একটি শাস্তিমূলক পদ্ধতি", "D. একটি পাঠ্যবই"], ans: "A" },
      { id: 14, q: "একজন শিক্ষক লক্ষ্য করলেন যে একজন শিক্ষার্থী মৌখিক আলোচনায় ভালো, কিন্তু লিখিত কাজে বেশি সময় নেয়। শিক্ষকের উপযুক্ত দৃষ্টিভঙ্গি কী হওয়া উচিত?", options: ["A. তাকে কম মেধাবী হিসেবে চিহ্নিত করা", "B. individual differences বিবেচনা করা", "C. তাকে সব কার্যক্রম থেকে বাদ দেওয়া", "D. শুধুমাত্র লিখিত পরীক্ষার ওপর নির্ভর করা"], ans: "B" },
      { id: 15, q: "একজন শিক্ষার্থী স্থানিক বিন্যাস, মানচিত্র ও নকশা বুঝতে বিশেষ দক্ষ। Gardner-এর তত্ত্ব অনুযায়ী এটি কোন intelligence-এর সঙ্গে সম্পর্কিত?", options: ["A. Linguistic intelligence", "B. Spatial intelligence", "C. Musical intelligence", "D. Interpersonal intelligence"], ans: "B" },
      { id: 16, q: "দৃষ্টিপ্রতিবন্ধী শিক্ষার্থীকে একই পাঠে সক্রিয়ভাবে অংশগ্রহণের সুযোগ দিতে কোন ব্যবস্থা সবচেয়ে উপযুক্ত?", options: ["A. তাকে শ্রেণিকক্ষের বাইরে রাখা", "B. শুধুমাত্র বোর্ডের লেখা পড়তে বলা", "C. শ্রুতিনির্ভর উপকরণ ও accessible learning material ব্যবহার করা", "D. তাকে পরীক্ষায় অংশগ্রহণ না করতে দেওয়া"], ans: "C" },

    let currentStudent = { name: "", phone: "" };
    let timerInterval;
    let timeRemaining = questions.length * 60; // 1 min per question (50 mins)

    async function startExam() {
      const phone = document.getElementById("student-phone").value.trim();
      const name = document.getElementById("student-name").value.trim() || "Student";
      const errorEl = document.getElementById("login-error");

      if (!phone) {
        errorEl.textContent = "Please enter your mobile number.";
        return;
      }

      errorEl.textContent = "Verifying mobile number...";

      try {
        const response = await fetch(`${APP_SCRIPT_URL}?action=verify&phone=${phone}`);
        const result = await response.json();

        if (result.success) {
          currentStudent = { name, phone };
          document.getElementById("login-section").classList.add("hidden");
          document.getElementById("test-section").classList.remove("hidden");
          document.getElementById("user-display").textContent = `Student: ${name} (${phone})`;
          document.getElementById("preview-student-name").textContent = name;
          document.getElementById("preview-student-phone").textContent = phone;
          renderQuestions();
          startTimer();
        } else {
          errorEl.textContent = result.message;
        }
      } catch (err) {
        errorEl.textContent = "Error connecting to the whitelist server. Please verify your Web App URL.";
      }
    }

    function renderQuestions() {
      const container = document.getElementById("questions-container");
      container.innerHTML = questions.map(q => `
        <div class="question-card" id="q-card-${q.id}">
          <div class="question-title">${q.id}. ${q.q}</div>
          <ul class="options-list">
            ${q.options.map((opt, idx) => {
              const optVal = String.fromCharCode(65 + idx);
              return `
                <li>
                  <label id="lbl-${q.id}-${optVal}">
                    <input type="radio" name="q_${q.id}" value="${optVal}">
                    ${opt}
                  </label>
                </li>
              `;
            }).join("")}
          </ul>
        </div>
      `).join("");
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeRemaining--;
        const mins = Math.floor(timeRemaining / 60);
        const secs = timeRemaining % 60;
        document.getElementById("timer").textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          submitExam();
        }
      }, 1000);
    }

    function submitExam() {
      clearInterval(timerInterval);

      let correct = 0;
      let wrong = 0;
      let unattempted = 0;

      questions.forEach(q => {
        const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
        if (selected) {
          if (selected.value === q.ans) {
            correct++;
          } else {
            wrong++;
          }
        } else {
          unattempted++;
        }
      });

      const score = (correct * 1) - (wrong * 0.25);

      document.getElementById("res-name").textContent = currentStudent.name;
      document.getElementById("res-phone").textContent = currentStudent.phone;
      document.getElementById("res-total").textContent = questions.length;
      document.getElementById("res-correct").textContent = correct;
      document.getElementById("res-wrong").textContent = wrong;
      document.getElementById("res-unattempted").textContent = unattempted;
      document.getElementById("res-score").textContent = score.toFixed(2);

      // Save Data to Google Sheet
      fetch(APP_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: currentStudent.name,
          phone: currentStudent.phone,
          score: score,
          correct: correct,
          wrong: wrong,
          unattempted: unattempted
        })
      });

      document.getElementById("test-section").classList.add("hidden");
      document.getElementById("result-section").classList.remove("hidden");
    }

    function enablePreview() {
      document.getElementById("result-section").classList.add("hidden");
      document.getElementById("test-section").classList.remove("hidden");
      document.body.classList.add("preview-mode");

      // Hide the Submit Test button completely during preview/download
      document.getElementById("submit-btn").style.display = "none";

      questions.forEach(q => {
        const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
        const correctLabel = document.getElementById(`lbl-${q.id}-${q.ans}`);
        
        if (correctLabel) {
          correctLabel.classList.add("correct-ans");
        }

        if (selected && selected.value !== q.ans) {
          const wrongLabel = document.getElementById(`lbl-${q.id}-${selected.value}`);
          if (wrongLabel) {
            wrongLabel.classList.add("wrong-ans");
          }
        }
        
        // Disable choices in preview mode
        const inputs = document.querySelectorAll(`input[name="q_${q.id}"]`);
        inputs.forEach(i => i.disabled = true);
      });
    }
  </script>
